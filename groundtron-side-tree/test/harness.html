<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Side Tree harness</title>
<link rel="stylesheet" href="../panel.css">
<style>
  body { background:#1b1a19; color:#ecebe8; font:14px/1.5 -apple-system,Segoe UI,sans-serif; margin:0; padding:24px; padding-right:340px; }
  main { max-width:620px; }
  .msg { border:1px solid #302e2c; border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .tool { font-family:ui-monospace,Consolas,monospace; color:#9a9a96; }
  button { font:inherit; padding:6px 10px; margin:2px; border-radius:6px; border:1px solid #444; background:#262524; color:inherit; cursor:pointer; }
  #composer { border:1px solid #444; border-radius:8px; padding:10px; min-height:60px; margin-top:14px; }
</style>
</head>
<body>
<main>
  <h1>Harness</h1>
  <div class="msg">Przejrzyj kod i popraw walidacje.</div>
  <div class="msg"><div class="tool">Read(src/app/main.ts)</div></div>
  <div class="msg"><div class="tool">Read(src/app/util/paths.ts)</div></div>
  <div class="msg"><div class="tool">Edit(src/app/main.ts)</div></div>
  <div class="msg"><div class="tool">Write(src/app/util/validate.ts)</div></div>
  <div class="msg"><div class="tool">Update(C:\Users\me\proj\README.md)</div></div>
  <div class="msg">Nie-pliki do odsiania: claude.ai, wersja 2.1.299, e.g. oraz https://example.com/a/b.html</div>
  <div id="stream"></div>
  <div id="composer" contenteditable="true">napraw to</div>
</main>
<div style="position:fixed;left:24px;bottom:16px">
  <button onclick="add('Read(src/app/util/paths.ts)')">+ Read paths.ts</button>
  <button onclick="add('Edit(src/app/util/validate.ts)')">+ Edit validate.ts</button>
  <button onclick="add('Write(docs/notes/plan.md)')">+ Write plan.md</button>
  <button onclick="tasks(1)">+ lista zadan 1/4</button>
  <button onclick="tasks(3)">lista zadan 3/4</button>
  <button onclick="document.querySelector('#composer').innerText='dodaj limitowanie zapytan do @src/app/main.ts, zejdz ponizej 200KB, uruchom testy i pokaz wynik w tabeli'">wypelnij prompt</button>
</div>
<script>
function tasks(n) {
  const names = ['Przeczytaj kod', 'Napisz poprawke', 'Uruchom testy', 'Opisz zmiany'];
  let box = document.getElementById('tasks');
  if (!box) { box = document.createElement('div'); box.id = 'tasks'; box.className = 'msg'; document.getElementById('stream').appendChild(box); }
  box.innerHTML = names.map((t, i) => '<div>' + (i < n ? '☑ ' : '☐ ') + t + '</div>').join('');
}
function add(text) {
  const d = document.createElement('div');
  d.className = 'msg';
  d.innerHTML = '<div class="tool"></div>';
  document.getElementById('stream').appendChild(d);
  // stream it in, a few characters at a time, like the real transcript does
  const target = d.firstChild;
  let i = 0;
  const t = setInterval(() => {
    target.textContent = text.slice(0, ++i);
    if (i >= text.length) clearInterval(t);
  }, 25);
}
</script>
<script src="../lang-default.js"></script>
<script src="../i18n/base.js"></script>
<script src="../i18n/pl.js"></script>
<script src="../i18n/en.js"></script>
<script src="../i18n/csb.js"></script>
<script src="../i18n/szl.js"></script>
<script src="../i18n/gor.js"></script>
<script src="../prompts.js"></script>
<script src="../content.js"></script>
</body>
</html>
